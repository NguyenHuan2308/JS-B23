<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/user.css">
</head>

<body>
  <!-- Header -->
  <header class="sticky-top">
    <nav class="navbar bg-info-subtle">
      <div class="container">
        <h1 class="navbar-brand mx-auto fs-1 fw-bold">Store Page</h1>
        <a href="../../index.html" class="text-decoration-none text-secondary d-flex gap-md-2 fw-bold"><i
            class="fa-solid fa-house"></i>
          <p class="d-md-block d-none">Home</p>
        </a>
      </div>
    </nav>
  </header>
  <!-- End Header -->

  <div class="container py-5">
    <!-- Section 1 -->
    <section>
      <!-- Title -->
      <h2 class="mt-md-4 fs-2 fw-bolder title mb-4">Danh sách sản phẩm</h2>

      <!-- List products -->
      <div class="row g-3 g-md-5" id="productList">
      </div>
      <!-- end list products -->

      <!-- Modal chi tiết sp -->
      <div class="modal fade" id="productDetailModal">
        <div class="modal-dialog modal-dialog-centered modal-lg">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title fw-bold fs-4" id="modalProductName"></h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
              <div class="row align-items-center">
                <div class="col-12 col-md-5 text-center">
                  <img id="modalProductImg" src="" class="img-fluid p-2"
                    style="max-height: 250px; object-fit: contain;">
                </div>
                <div class="col-12 col-md-7">
                  <h4 class="mb-3 text-bold fw-bolder">Giá: <span id="modalProductPrice" class="productPrice"></span></h4>
                  <p><span class="text-bold fw-bolder">Loại sản phẩm:</span> <span class="badge bg-secondary fs-6" id="modalProductType"></span>
                  </p>
                  <p class="text-bold fw-bolder mt-3">Mô tả: <span id="modalProductDesc" class="fw-medium"></span></p>
                  <p class="text-bold fw-bolder mt-3">Tình Trạng: <span id="modalProductDeleted" class="fw-medium"></span></p>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
              <button type="button" class="btn btn-primary">Thêm vào giỏ hàng</button>
            </div>
          </div>
        </div>
      </div>
      <!-- End Modal chi tiết sp -->

    </section>
    <!-- End Section 1 -->
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
    integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"
    integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script type="module" src="../controller/main.js"></script>
</body>

</html>
