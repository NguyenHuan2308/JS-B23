<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>
  <!-- Header -->
  <header class="sticky-top">
    <nav class="navbar bg-info-subtle">
      <div class="container">
        <h1 class="navbar-brand mx-auto fs-1 fw-bold">Admin Page</h1>
        <a href="../../index.html" class="text-decoration-none text-secondary d-flex gap-md-2 fw-bold"><i
            class="fa-solid fa-house"></i>
          <p class="d-md-block d-none">Home</p>
        </a>
      </div>
    </nav>
  </header>
  <!-- End Header -->

  <!-- Phần content -->
  <div class="container py-5">

    <!-- Title -->
    <div class="d-flex justify-content-between align-items-center">
      <h2 class="mt-md-4 fs-2 fw-bolder title mb-4">Danh sách sản phẩm</h2>
      <button id="cart" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProductModal">Thêm sản phẩm
        mới
        <i class="fa-solid fa-plus"></i></button>
    </div>

    <!-- Search and filter -->
    <div class="input-group input-group-lg mb-3">
      <div class="d-flex w-75">
        <!-- <label class="input-group-text" for="searchName">Tìm kiếm: </label> -->
        <input id="searchName" type="text" class="form-control"
          placeholder="Nhập tên sản phẩm:(Ví dụ: Iphone 18 siêu cấp...)">
      </div>
      <div class="w-25">
        <select class="form-select" id="dropdownType">
          <option value="">Sắp xếp theo giá</option>
          <option value="tang">Giá tăng dần</option>
          <option value="giam">Giá giảm dần</option>
        </select>
      </div>
    </div>

    <!-- Table products -->
    <div class="table-responsive">
      <table class="table table-striped table-bordered table-hover align-middle border-dark">
        <thead class="table-info text-center fw-bold">
          <tr>
            <th scope="col" style="width: 5%;">STT</th>
            <th scope="col" style="width: 10%;">Hình ảnh</th>
            <th scope="col" style="width: 20%;">Tên sản phẩm</th>
            <th scope="col" style="width: 25%;">Mô tả</th>
            <th scope="col" style="width: 12%;">Giá</th>
            <th scope="col" style="width: 10%;">Loại</th>
            <th scope="col" style="width: 10%;">Trạng thái</th>
            <th scope="col" style="width: 8%;">Thao tác</th>
          </tr>
        </thead>
        <tbody id="tableProduct" class="table-group-divider">

        </tbody>
      </table>
      <!-- End table products -->
    </div>

    <!-- Modal chi tiết sp và edit-->
    <div class="modal fade" id="productDetailModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg">

          <!-- Header -->
          <div class="modal-header bg-light py-3">
            <h5 class="modal-title fw-bold fs-4 text-dark">
              <i class="fa-solid fa-pen-to-square text-primary me-2"></i> Chỉnh sửa sản phẩm
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>

          <!-- Body -->
          <div class="modal-body p-4">
            <div class="row align-items-center g-4">

              <!-- Cột hiển thị hình ảnh -->
              <div class="col-12 col-md-5 text-center">
                <div class="p-3 border rounded bg-white shadow-sm">
                  <img id="modalProductImg" src="" class="img-fluid rounded"
                    style="max-height: 220px; object-fit: contain;" alt="Product Image">
                </div>
              </div>

              <!-- Cột form nhập liệu -->
              <div class="col-12 col-md-7">
                <div class="mb-3">
                  <label for="modalProductName" class="form-label fw-bold  text-secondary">Tên sản phẩm</label>
                  <input id="modalProductName" type="text" class="form-control shadow-none">
                </div>

                <div class="row g-2 mb-3">
                  <div class="col-6">
                    <label for="modalProductType" class="form-label fw-bold  text-secondary">Loại sản phẩm</label>
                    <input id="modalProductType" type="text" class="form-control shadow-none">
                  </div>
                  <div class="col-6">
                    <label for="modalProductPrice" class="form-label fw-bold  text-secondary">Giá (VNĐ)</label>
                    <input id="modalProductPrice" type="text" class="form-control shadow-none productPrice">
                  </div>
                </div>

                <div class="mb-3">
                  <label for="modalProductDesc" class="form-label fw-bold text-secondary">Mô tả</label>
                  <textarea id="modalProductDesc" class="form-control shadow-none" rows="2"></textarea>
                </div>
              </div>

            </div>
          </div>
          <!-- Footer -->
          <div class="modal-header bg-light py-3 border-top justify-content-end gap-2">
            <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Đóng</button>
            <button type="button" class="btn btn-primary px-4 fw-bold" id="btnUpdate">
              <i class="fa-solid fa-floppy-disk me-1"></i> Lưu thay đổi
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- End Modal chi tiết sp và edit-->

    <!-- Modal ADD SP -->
    <div class="modal fade" id="addProductModal">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg">

          <!-- Header -->
          <div class="modal-header bg-light py-3">
            <h5 class="modal-title fw-bold fs-4 text-dark">
              <i class="fa-solid fa-plus text-primary me-2"></i> Thêm sản phẩm mới
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>

          <!-- Body -->
          <div class="modal-body p-4">
            <div class="align-items-center">

              <!-- Tên -->
              <div class="row g-3">
                <div class="col-4">
                  <div class="mb-3">
                    <label for="addProductID" class="form-label fw-bold text-dark">Nhập mã sản phẩm:</label>
                    <input id="addProductID" type="text" class="form-control shadow-none"
                      placeholder="Ví dụ: SP001, ID999...">
                  </div>
                </div>

                <div class="col-8">
                  <div class="mb-3">
                    <label for="addProductName" class="form-label fw-bold text-dark">Tên sản phẩm</label>
                    <input id="addProductName" type="text" class="form-control shadow-none"
                      placeholder="Ví dụ: Iphone 99...">
                  </div>
                </div>
              </div>

              <!-- Link img -->
              <div class="mb-3">
                <label for="addProductImg" class="form-label fw-bold text-dark">Link ảnh sản phẩm</label>
                <input id="addProductImg" type="text" class="form-control shadow-none"
                  placeholder="Ví dụ: https://staticg.sportskeeda.com/editor/2025/06/ffd2a-17500592548566-1920.jpg">
              </div>

              <div class="row g-3 mb-3">
                <div class="col-6">
                  <label for="addProductType" class="form-label fw-bold text-dark">Loại sản phẩm</label>
                  <input id="addProductType" type="text" class="form-control shadow-none"
                    placeholder="Ví dụ:Laptop, Phone...">
                </div>
                <div class="col-6">
                  <label for="addProductPrice" class="form-label fw-bold small text-dark">Giá (VNĐ)</label>
                  <input id="addProductPrice" type="text" class="form-control shadow-none"
                    placeholder="Ví dụ: 100000, 999999...">
                </div>
              </div>

              <div class="mb-3">
                <label for="addProductDesc" class="form-label fw-bold small text-dark">Mô tả</label>
                <textarea id="addProductDesc" class="form-control shadow-none" rows="2"
                  placeholder="Mô tả về sản phẩm (Tính năng nổi bật, công nghệ sử dụng ...)"></textarea>
              </div>

            </div>
          </div>
          <div class="modal-header bg-light py-3 border-top justify-content-end gap-2">
            <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Đóng</button>
            <button type="button" class="btn btn-primary px-4 fw-bold" id="btnAdd">
              Thêm sản phẩm
            </button>
          </div>
        </div>
        <!-- Footer -->

      </div>
    </div>
  </div>
  <!-- End modal add sp-->



  <!-- Alert add to cart -->
  <div id="alert" class="alert alert-success position-fixed end-0 m-3 shadow d-none" style="top: 30px; z-index: 9999;">
  </div>
  <!-- End Alert -->
  </div>
  <!-- End content -->

  <!-- Footer -->
  <footer class="bg-light text-center py-4 mt-5 border-top">
    <div class="container">
      <p class="mb-1 fw-bold text-secondary">Store Page &copy; 2026</p>
      <p class="text-muted small mb-0">Bài tập Capstone JS - Cybersoft</p>
    </div>
  </footer>
  <!-- End Footer -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
    integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"
    integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script type="module" src="../../controller/admin/main.js"></script>
</body>

</html>
