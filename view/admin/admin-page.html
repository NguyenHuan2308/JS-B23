<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="stylesheet" href="../../assets/css/reset.css">
  <link rel="stylesheet" href="../../assets/css/admin.css">
</head>

<body>
  <!-- Header -->
  <header class="sticky-top">
    <nav class="navbar bg-info-subtle">
      <div class="container">
        <h1 class="navbar-brand mx-auto fs-1 fw-bold">Admin Page</h1>
        <a href="../../index.html" class="text-decoration-none text-secondary d-flex gap-md-2 fw-bold"><i
            class="fa-solid fa-house"></i>
          <p class="d-md-block d-none">Home</p>
        </a>
      </div>
    </nav>
  </header>
  <!-- End Header -->

  <!-- Phần content -->
  <div class="container py-5">

    <!-- Title -->
    <div class="d-flex justify-content-between align-items-center">
      <h2 class="mt-md-4 fs-2 fw-bolder title mb-4">Danh sách sản phẩm</h2>
      <button id="cart" class="btn btn-primary" data-bs-toggle="offcanvas" data-bs-target="#myCart">Thêm sản phẩm mới
        <i class="fa-solid fa-plus"></i></button>
    </div>

    <!-- Table products -->
    <div class="table-responsive">
      <table class="table table-striped table-bordered table-hover align-middle border-dark">
        <thead class="table-info text-center fw-bold">
          <tr>
            <th scope="col" style="width: 5%;">STT</th>
            <th scope="col" style="width: 10%;">Hình ảnh</th>
            <th scope="col" style="width: 20%;">Tên sản phẩm</th>
            <th scope="col" style="width: 25%;">Mô tả</th>
            <th scope="col" style="width: 12%;">Giá</th>
            <th scope="col" style="width: 10%;">Loại</th>
            <th scope="col" style="width: 10%;">Trạng thái</th>
            <th scope="col" style="width: 8%;">Thao tác</th>
          </tr>
        </thead>
        <tbody id="tableProduct" class="table-group-divider">

        </tbody>
      </table>
      <!-- End table products -->
    </div>

    <!-- Modal chi tiết sp và edit-->
    <div class="modal fade" id="productDetailModal">
      <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <p class="fw-bold fs-3 text-dark">Sửa sản phẩm</p>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="row align-items-center">
              <div class="col-12 col-md-5 text-center">
                <img id="modalProductImg" src="" class="img-fluid p-2" style="max-height: 250px; object-fit: contain;">
              </div>
              <div class="col-12 col-md-7">
                <p class="text-bold fw-bolder mt-3">Tên sản phẩm:<input id="modalProductName"></input></p>
                <p class="text-bold fw-bolder mt-3">Loại sản phẩm: <input id="modalProductType"></input>
                <p class="text-bold fw-bolder mt-3">Giá: <input id="modalProductPrice" class="productPrice"></input>
                  </h4>
                </p>
                <p class="text-bold fw-bolder mt-3">Mô tả: <input id="modalProductDesc"></input></p>
                <p class="text-bold fw-bolder mt-3">Tình Trạng: <select id="modalProductDeleted">
                    <option value="1">Còn hàng</option>
                    <option value="0">Hết hàng</option>
                  </select>
                </p>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Đóng</button>
            <button type="button" class="btn btn-primary" id="btnUpdate">Cập nhật sản phẩm</button>
          </div>
        </div>
      </div>
    </div>
    <!-- End Modal chi tiết sp và edit-->



    <!-- Alert add to cart -->
    <!-- <div id="alert" class="alert alert-success position-fixed end-0 m-3 shadow d-none"
      style="top: 30px; z-index: 9999;"></div> -->
    <!-- End Alert -->
  </div>
  <!-- End content -->

  <!-- Footer -->
  <footer class="bg-light text-center py-4 mt-5 border-top">
    <div class="container">
      <p class="mb-1 fw-bold text-secondary">Store Page &copy; 2026</p>
      <p class="text-muted small mb-0">Bài tập Capstone JS - Cybersoft</p>
    </div>
  </footer>
  <!-- End Footer -->

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"
    integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.20.0/axios.min.js"
    integrity="sha512-OVq+Gfa9PIjbTC0jWOccSFSp/vzkBQ5pMcbHQrNZLl+izmdFmusmAMlX4LT550ivvSnMXMEeG7CxEtjIz6Dn2Q=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>

  <script type="module" src="../../controller/admin/main.js"></script>
</body>

</html>
